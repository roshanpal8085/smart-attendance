name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Backend lint & test
  # ─────────────────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          find app -name "*.py" -print0 | xargs -0 python -m py_compile
          echo "Syntax check passed ✓"

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Admin Web lint & build
  # ─────────────────────────────────────────────────────────────────
  admin-web-lint-test:
    name: Admin Web — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─────────────────────────────────────────────────────────────────
  # Job 3 — Docker Compose validation
  # ─────────────────────────────────────────────────────────────────
  docker-compose-validate:
    name: Docker Compose — Validate Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create stub .env for validation
        run: |
          cp .env.example .env
          sed -i 's/change_me_in_production/ci_placeholder/g' .env
          sed -i 's/CHANGE-THIS-TO-A-256-BIT-RANDOM-SECRET/ci-jwt-secret/g' .env

      - name: Validate docker compose configuration
        run: docker compose config --quiet
