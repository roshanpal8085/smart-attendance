version: "3.9"

networks:
  attendance_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ─────────────────────────── Database ───────────────────────────
  postgres:
    image: postgres:16
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: roshan@8962042946
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - attendance_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────── Cache ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - attendance_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────── Backend ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - attendance_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────── Admin Web ──────────────────────────
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: attendance_admin_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - attendance_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
